<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>大考中心 6000 單字查詢</title>
<style>
  :root{
    --paper:#F6F2E9;
    --ink:#1B2A3A;

    --accent:#2E6E62;
    --accent-soft:#DCEAE6;
    --warn:#B0402E;
    --warn-soft:#F4E3DE;

  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif TC","Georgia",serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 5vw 8vh;
  }
  .wrap{width:100%;max-width:640px;}
  header{margin-bottom:2.2rem;text-align:center;}
  h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:.02em;
    margin:0 0 .35rem;
  }
  .sub{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink-soft);
    font-size:.92rem;
    line-height:1.6;
    margin:0;
  }
  form{
    display:flex;
    gap:.6rem;
    margin-bottom:1.6rem;
  }
  input[type="text"]{
    flex:1;
    font-size:1.15rem;
    font-family:"Georgia",serif;
    padding:.85rem 1rem;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  button.go{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:1rem;
    font-weight:600;
    padding:.85rem 1.4rem;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  button.go:active{transform:translateY(1px);}

  #results{display:flex;flex-direction:column;gap:.9rem;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:1.2rem 1.3rem;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:.8rem;
    flex-wrap:wrap;
  }
  .headword{
    font-size:1.7rem;
    font-weight:700;
    color:var(--ink);
  }
  .say{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.85rem;
    font-weight:600;
    border:1.5px solid var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:7px;
    padding:.4rem .7rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .say:active{transform:translateY(1px);}
  .meta{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    gap:.55rem;
    margin-top:.55rem;
    flex-wrap:wrap;
  }
  .level-badge{
    font-size:.82rem;
    font-weight:700;
    color:#fff;
    padding:.15rem .55rem;
    border-radius:999px;
  }
  .range-tag{
    font-size:.78rem;
    color:var(--ink-soft);
  }
  .pos{
    font-size:.9rem;
    color:var(--ink-soft);
    font-style:italic;
  }
  .meaning{
    margin-top:.5rem;
    font-size:1.15rem;
    color:var(--ink);
  }
  .meaning.missing{color:var(--warn);font-size:.95rem;}

  .empty, .notfound{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:center;
    color:var(--ink-soft);
    padding:1.4rem 1rem;
    font-size:.98rem;
    line-height:1.7;
  }
  .notfound{
    background:var(--warn-soft);
    border:1px solid #E3C4B9;
    border-radius:10px;
    color:var(--warn);
  }
  footer{
    margin-top:2.5rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.78rem;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>大考中心 6000 單字查詢</h1>
    <p class="sub">輸入一個英文單字，查詢它在 Level 1–6 的哪一級、詞性與中文意思。<br>Level 1–4 為學測常考範圍（俗稱4500字），Level 5–6 為指考／分科測驗才會加考的範圍。</p>
  </header>

  <form id="searchForm">
    <input type="text" id="q" placeholder="輸入英文單字，例如 material" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" class="go">查詢</button>
  </form>

  <div id="results">
    <p class="empty">輸入單字後按查詢，或直接按 Enter。</p>
  </div>

  <footer>
    資料來源：學測6000字（王介立醫師製作版）。<span id="wordCount">資料載入中…</span><br>
    若查無此字，可能是拼字有誤，或此字不在這份6000字表中——不代表這個字完全不會考。
  </footer>
</div>

// Build lookup index: lowercase word -> array of entry objects
const INDEX = {};
for (const tuple of DATA) {
  const e = { word: tuple[0], level: tuple[1], pos: tuple[2], meaning: tuple[3], display: tuple[4] };
  const key = e.word.toLowerCase();
  if (!INDEX[key]) INDEX[key] = [];
  INDEX[key].push(e);
}

document.getElementById('wordCount').textContent = `已載入 ${DATA.length} 個詞條`;

const levelRange = (lv) => lv <= 4 ? "屬於學測範圍（4500字）" : "指考／分科測驗才加考（7000字範圍）";

function speak(word){
  if (!('speechSynthesis' in window)) {
    alert('此瀏覽器不支援語音朗讀功能');
    return;
  }
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function render(word){
  const resultsEl = document.getElementById('results');
  const key = word.trim().toLowerCase();
  if (!key) {
    resultsEl.innerHTML = '<p class="empty">輸入單字後按查詢，或直接按 Enter。</p>';
    return;
  }
  const entries = INDEX[key];
  if (!entries) {
    resultsEl.innerHTML = `<div class="notfound">查無「${escapeHtml(word)}」這個字。<br>請確認拼字是否正確；若拼字無誤，代表此字不在這份6000字詞彙表中。</div>`;
    return;
  }
  resultsEl.innerHTML = entries.map(e => {
    const badgeColor = ['','var(--l1)','var(--l2)','var(--l3)','var(--l4)','var(--l5)','var(--l6)'][e.level];
    const meaningClass = e.meaning.includes('原始資料缺此欄') ? 'meaning missing' : 'meaning';
    return `
    <div class="card">
      <div class="card-top">
        <span class="headword">${escapeHtml(e.display)}</span>
        <button class="say" onclick="speak('${escapeAttr(e.word)}')">🔊 發音</button>
      </div>
      <div class="meta">
        <span class="level-badge" style="background:${badgeColor}">Level ${e.level}</span>
        <span class="range-tag">${levelRange(e.level)}</span>
        <span class="pos">${escapeHtml(e.pos)}</span>
      </div>
      <div class="${meaningClass}">${escapeHtml(e.meaning)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
  return String(s).replace(/'/g, "\\'");
}

document.getElementById('searchForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  render(document.getElementById('q').value);
});
</script>
